<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<script>
  // ===== 切換前只要改這一行（或用 fill_url.py 一次換好全部三個地方）=====
  const NEW_URL = 'https://rsconnect-pred.roche.com/content/REPLACE_ME/';
  // =====================================================================
  (function () {
    var DELAY_MS = 1200;   // 讓人看一眼「搬新家了」再走；JS 停用時改由下面 noscript 裡的 meta refresh（2 秒）帶過去

    function ready() { return NEW_URL.indexOf('REPLACE_ME') === -1 && /^https:\/\//.test(NEW_URL); }

    // 舊網站的「強制更新」按鈕會加上 ?v=時間戳記；那個參數對新網站沒有意義，拿掉。其他查詢字串和 #hash 照原樣帶過去。
    function target() {
      try {
        var to = new URL(NEW_URL);
        var from = new URLSearchParams(window.location.search);
        from.forEach(function (value, key) {
          if (key === 'v' && /^\d+$/.test(value)) return;
          to.searchParams.append(key, value);
        });
        to.hash = window.location.hash;
        return to.toString();
      } catch (e) {
        return NEW_URL;
      }
    }

    window.__thankwallTarget = target;
    window.__thankwallReady = ready;
    if (!ready()) return;
    window.__thankwallTimer = setTimeout(function () { window.location.replace(target()); }, DELAY_MS);
  })();
</script>
<!-- JS 停用時由 meta refresh 帶過去（放在 noscript 裡，JS 開著時就不會和上面的跳轉搶先，查詢字串和 #hash 才帶得過去） -->
<noscript><meta http-equiv="refresh" content="2;url=https://rsconnect-pred.roche.com/content/REPLACE_ME/"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fde2e4">
<title>感謝牆搬新家了</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28s-11-7-11-15a6 6 0 0 1 11-3.3A6 6 0 0 1 27 13c0 8-11 15-11 15z' fill='%23d64966'/%3E%3C/svg%3E">
<style>
  :root {
    --rose: #c2334f;
    --rose-dark: #9f1239;
    --ink: #3b2a30;
    --muted: #6b5560;
    --card: #fffdfb;
    --line: #f3d6da;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 214, 165, .55), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255, 179, 193, .55), transparent 50%),
      linear-gradient(160deg, #fff4ec 0%, #fde2e4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 18px 50px rgba(159, 18, 57, .12), 0 2px 6px rgba(159, 18, 57, .06);
    padding: 36px 32px 28px;
    text-align: center;
  }
  .art { width: 112px; height: 112px; margin: 0 auto 12px; display: block; }
  .art .heart { transform-origin: 56px 64px; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } 24% { transform: scale(1); } 36% { transform: scale(1.08); } }
  h1 { font-size: 28px; line-height: 1.3; margin: 0 0 6px; color: var(--rose-dark); letter-spacing: .02em; }
  .status { margin: 0 0 22px; font-size: 17px; color: var(--muted); min-height: 1.6em; }
  .dots::after { content: "…"; display: inline-block; animation: dots 1.2s steps(4, end) infinite; overflow: hidden; vertical-align: bottom; width: 1.2em; text-align: left; }
  @keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }
  .go {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(194, 51, 79, .3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .go:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(194, 51, 79, .38); }
  .go:focus-visible { outline: 3px solid #f5c84c; outline-offset: 3px; }
  .tips { list-style: none; margin: 24px 0 0; padding: 0; text-align: left; display: grid; gap: 12px; }
  .tips li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; }
  .tips .ico { flex: 0 0 32px; height: 32px; border-radius: 10px; background: #fff0f2; display: flex; align-items: center; justify-content: center; }
  .tips b { color: var(--ink); }
  .url { display: block; margin-top: 2px; font-size: 13.5px; color: var(--muted); word-break: break-all; }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .warn { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: #fff7e0; border: 1px solid #f3d27a; color: #6b4a00; font-size: 15px; text-align: left; }
  body.not-ready .warn { display: block; }
  body.not-ready .status { display: none; }
  @media (max-width: 420px) {
    .card { padding: 28px 20px 22px; border-radius: 20px; }
    h1 { font-size: 24px; }
    .art { width: 92px; height: 92px; }
    .go { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .art .heart, .dots::after { animation: none; }
    .go { transition: none; }
  }
</style>
</head>
<body>
<main class="card" role="main">
  <svg class="art" viewBox="0 0 112 112" aria-hidden="true">
    <circle cx="56" cy="56" r="54" fill="#fff0f2"/>
    <path d="M22 58 56 30l34 28" fill="none" stroke="#f0a8b4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 54v32a4 4 0 0 0 4 4h44a4 4 0 0 0 4-4V54" fill="#fffdfb" stroke="#f0a8b4" stroke-width="5" stroke-linejoin="round"/>
    <g class="heart"><path d="M56 82s-16-9.5-16-21a8.5 8.5 0 0 1 16-4 8.5 8.5 0 0 1 16 4c0 11.5-16 21-16 21z" fill="#d64966"/></g>
    <circle cx="88" cy="26" r="4" fill="#f5c84c"/><circle cx="22" cy="34" r="3" fill="#fdba74"/><circle cx="94" cy="78" r="2.5" fill="#fdba74"/>
  </svg>
  <h1>感謝牆搬新家了！</h1>
  <p class="status" id="status" aria-live="polite"><span class="dots">正在帶你過去</span></p>
  <p class="warn" id="warn" role="alert">新網址還沒設定好，暫時無法自動帶你過去。請稍後再試，或聯絡感謝牆管理員。</p>
  <a class="go" id="go" href="https://rsconnect-pred.roche.com/content/REPLACE_ME/">前往新的感謝牆</a>
  <ul class="tips">
    <li><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="#d64966"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#d64966" stroke-width="2"/></svg></span>
      <span><b>請用公司帳號登入</b>，和平常登入公司系統一樣。</span></li>
    <li><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="#d64966"/></svg></span>
      <span><b>書籤記得更新</b>成新網址：<span class="url" id="url">https://rsconnect-pred.roche.com/content/REPLACE_ME/</span></span></li>
    <li><span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="#d64966"/></svg></span>
      <span>以前的感謝卡都一起搬過去了，<b>到新家一樣看得到</b>。</span></li>
  </ul>
  <p class="foot">RDTW 感謝牆｜每一個微小的感謝，都是照亮團隊的光</p>
</main>
<script>
  (function () {
    var go = document.getElementById('go');
    var url = document.getElementById('url');
    if (!window.__thankwallReady || !window.__thankwallReady()) {
      document.body.classList.add('not-ready');
      go.removeAttribute('href');
      go.setAttribute('aria-disabled', 'true');
      go.style.opacity = '.5';
      go.style.pointerEvents = 'none';
      url.textContent = '（還沒設定）';
      return;
    }
    var to = window.__thankwallTarget();
    go.href = to;
    url.textContent = NEW_URL;
    go.addEventListener('click', function (e) {
      e.preventDefault();
      clearTimeout(window.__thankwallTimer);
      window.location.replace(to);
    });
  })();
</script>
</body>
</html>
