<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司感謝牆 Gratitude Wall</title>
    <style>
        /* 基礎設定與溫馨漸層背景 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 裝飾性幾何背景 */
        .geometry-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }
        .geometry-bg.right {
            top: auto;
            bottom: -10%;
            left: auto;
            right: -10%;
            background: rgba(255, 182, 193, 0.3);
        }

        /* 感謝牆主體 */
        #wall {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 感謝卡片設計（玻璃擬態 + 加大字體版） */
        .message-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #4a4a4a;
            font-weight: 700;
            font-size: 22px;
            line-height: 1.5;
            letter-spacing: 1px;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            max-width: 320px;
            word-wrap: break-word;
            text-align: center;
        }

        /* 輸入區介面 */
        .input-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 18px;
            outline: none;
            color: #333;
        }

        button {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.7);
        }
    </style>
</head>
<body>

    <div class="geometry-bg"></div>
    <div class="geometry-bg right"></div>
    <div id="wall"></div>

    <div class="input-container">
        <input type="text" id="msgInput" placeholder="寫下你想感謝的人或事..." autocomplete="off">
        <button onclick="submitMessage()">送出感謝</button>
    </div>

    <script>
        let messages = JSON.parse(localStorage.getItem('company_gratitude')) || [];

        function submitMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text === '') return;

            messages.unshift({ text: text, id: Date.now() });
            localStorage.setItem('company_gratitude', JSON.stringify(messages));
            input.value = '';
            renderWall();
        }

        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitMessage();
        });

        function renderWall() {
            const wall = document.getElementById('wall');
            wall.innerHTML = '';
            
            const total = messages.length;
            if (total === 0) return;

            // 動態豐富度
            let richnessScale = 1;
            if (total <= 3) richnessScale = 1.8;
            else if (total <= 10) richnessScale = 1.4;
            else richnessScale = 1.1;

            const placedRects = []; // 記錄已經放置的卡片位置與大小，用來防碰撞
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const centerX = screenW / 2;
            const centerY = screenH * 0.45; 
            
            // 基礎的推移半徑（確保不會一開始就推到螢幕外）
            const maxRadius = Math.min(screenW, screenH) / 2 - 80;

            messages.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerText = msg.text;

                const ageRatio = total > 1 ? index / (total - 1) : 0;
                const scale = (1.5 - (ageRatio * 0.9)) * richnessScale;
                const opacity = 1 - (ageRatio * 0.35);
                const randomRotate = (Math.random() - 0.5) * 16;
                const zIndex = total - index;

                // 為了測量卡片實際大小，先將其加入畫面但不顯示
                card.style.visibility = 'hidden';
                card.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${randomRotate}deg)`;
                wall.appendChild(card);

                // 取得卡片縮放後的長寬
                const cardW = card.offsetWidth * scale;
                const cardH = card.offsetHeight * scale;

                // 碰撞偵測演算法：尋找空位
                let placedX = centerX;
                let placedY = centerY;
                let foundSpot = false;
                const distanceBase = ageRatio * maxRadius;
                
                // 最多嘗試 200 次尋找空位
                for (let attempt = 0; attempt < 200; attempt++) {
                    const angle = Math.random() * Math.PI * 2;
                    // 如果找不到位置，就逐漸往外擴散尋找 (attempt * 2)
                    const currentDistance = distanceBase + (attempt * 2); 
                    
                    const testX = centerX + currentDistance * Math.cos(angle);
                    const testY = centerY + currentDistance * Math.sin(angle);

                    // 檢查是否超出螢幕邊界 (避開底部的輸入框)
                    if (testX - cardW/2 < 20 || testX + cardW/2 > screenW - 20 || 
                        testY - cardH/2 < 20 || testY + cardH/2 > screenH - 120) {
                        continue; 
                    }

                    // 檢查是否與已放置的卡片重疊
                    let hasCollision = false;
                    for (let rect of placedRects) {
                        // 加上 20px 的間距 Padding
                        if (Math.abs(testX - rect.x) < (cardW + rect.w) / 2 + 20 &&
                            Math.abs(testY - rect.y) < (cardH + rect.h) / 2 + 20) {
                            hasCollision = true;
                            break;
                        }
                    }

                    if (!hasCollision) {
                        placedX = testX;
                        placedY = testY;
                        foundSpot = true;
                        break;
                    }
                }

                // 紀錄最終放置的位置供後續卡片參考
                placedRects.push({ x: placedX, y: placedY, w: cardW, h: cardH });

                // 正式套用位置與顯示
                card.style.left = `${placedX}px`;
                card.style.top = `${placedY}px`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
                card.style.visibility = 'visible'; // 恢復顯示
            });
        }

        // 監聽視窗大小改變，自動重新排版，確保視窗縮放時不會破圖
        window.addEventListener('resize', renderWall);

        // 初始渲染
        renderWall();
    </script>
</body>
</html>
