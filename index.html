<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司感謝牆 Gratitude Wall</title>
    <style>
        /* 基礎設定與溫馨漸層背景 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 裝飾性幾何背景 */
        .geometry-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }
        .geometry-bg.right {
            top: auto;
            bottom: -10%;
            left: auto;
            right: -10%;
            background: rgba(255, 182, 193, 0.3);
        }

        /* 感謝牆主體 */
        #wall {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 感謝卡片設計（玻璃擬態 Glassmorphism） */
        .message-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #4a4a4a;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            max-width: 250px;
            word-wrap: break-word;
            text-align: center;
        }

        /* 輸入區介面 */
        .input-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
            color: #333;
        }

        button {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
        }
    </style>
</head>
<body>

    <!-- 幾何背景裝飾 -->
    <div class="geometry-bg"></div>
    <div class="geometry-bg right"></div>

    <!-- 感謝牆 -->
    <div id="wall"></div>

    <!-- 輸入區 -->
    <div class="input-container">
        <input type="text" id="msgInput" placeholder="寫下你想感謝的人或事... (例如：謝謝小明幫我debug！)" autocomplete="off">
        <button onclick="submitMessage()">送出感謝</button>
    </div>

    <script>
        // 暫時使用瀏覽器的 LocalStorage 來儲存資料，方便你立刻預覽效果
        let messages = JSON.parse(localStorage.getItem('company_gratitude')) || [];

        function submitMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text === '') return;

            // 將新留言加入陣列最前方（最新的在前面）
            messages.unshift({
                text: text,
                id: Date.now()
            });

            // 儲存並重新渲染
            localStorage.setItem('company_gratitude', JSON.stringify(messages));
            input.value = '';
            renderWall();
        }

        // 綁定 Enter 鍵送出
        document.getElementById('msgInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitMessage();
        });

        function renderWall() {
            const wall = document.getElementById('wall');
            wall.innerHTML = ''; // 清空牆面
            
            const total = messages.length;

            messages.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerText = msg.text;

                // 核心演算法：根據新舊程度 (index) 決定大小與位置
                // index = 0 是最新，數值越大越舊
                const ageRatio = total > 1 ? index / (total - 1) : 0; // 介於 0 (最新) 到 1 (最舊) 之間

                // 1. 決定大小 (Scale)：最新 1.5 倍，最舊 0.6 倍
                const scale = 1.5 - (ageRatio * 0.9);

                // 2. 決定位置 (Position)：最新的在中心，舊的往外推 (極座標轉換)
                // 產生一個隨機角度
                const angle = Math.random() * Math.PI * 2; 
                // 距離中心的距離：越舊越遠。0% 是正中心，45% 是邊緣。
                const distance = (ageRatio * 40) + (Math.random() * 5); 
                
                const leftPercent = 50 + distance * Math.cos(angle);
                const topPercent = 45 + distance * Math.sin(angle); // 中心稍微偏上，避開底部輸入框

                // 3. 決定透明度 (Opacity) 與層級 (Z-index)
                const opacity = 1 - (ageRatio * 0.4); // 舊的稍微變透明，增加層次感
                const zIndex = total - index; // 新的蓋在舊的上面

                // 套用樣式
                card.style.left = `${leftPercent}%`;
                card.style.top = `${topPercent}%`;
                card.style.transform = `translate(-50%, -50%) scale(${scale})`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;

                // 隨機微調一點旋轉角度，更有塗鴉牆的隨興感
                const randomRotate = (Math.random() - 0.5) * 20; 
                card.style.transform += ` rotate(${randomRotate}deg)`;

                wall.appendChild(card);
            });
        }

        // 初始渲染
        renderWall();
    </script>
</body>
</html>
