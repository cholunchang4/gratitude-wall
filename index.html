<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司感謝牆</title>
    
    <!-- 引入撒花特效套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ================= 基礎設定 ================= */
        :root {
            --bg-gradient: linear-gradient(135deg, #fae0d4 0%, #f7c5b9 100%);
            --text-main: #4a4a4a;
            --text-sub: #555;
            --geo-bg-1: rgba(255, 255, 255, 0.3);
            --geo-bg-2: rgba(255, 182, 193, 0.2);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --input-bg: transparent;
            --name-bg: #f0f0f0;
            --card-border: rgba(255, 255, 255, 0.6);
            --icon-color: #333;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-gradient); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .geometry-bg { position: absolute; top: -10%; left: -10%; width: 400px; height: 400px; background: var(--geo-bg-1); border-radius: 50%; filter: blur(40px); z-index: 0; }
        .geometry-bg.right { top: auto; bottom: -10%; left: auto; right: -10%; background: var(--geo-bg-2); }
        
        /* ================= 標題華麗升級 ================= */
        .header-container { 
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%); text-align: center; 
            z-index: 1000; 
            width: max-content; max-width: 90%; pointer-events: none; 
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 15px 45px; border-radius: 60px;
            box-shadow: 0 10px 30px rgba(230, 100, 120, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.9);
        }
        
        #mainTitle { 
            font-size: 42px; font-weight: 900; margin: 0 0 8px 0; letter-spacing: 4px; 
            background: linear-gradient(135deg, #e63946 0%, #ff8fa3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 2px rgba(230, 57, 70, 0.15));
        }
        
        #subTitle { font-size: 17px; font-weight: 700; margin: 0; color: #d64966; letter-spacing: 2px; opacity: 0.9; }

        #wall { flex: 1; position: relative; width: 100%; height: 100%; z-index: auto; transition: all 0.5s ease; }

        /* ================= 卡片排版與字體 ================= */
        .message-card { 
            position: absolute; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            padding: 12px 18px 22px 18px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.12); 
            width: max-content; max-width: 280px; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; cursor: pointer; 
            --c-scale: 1; --c-rotate: 0deg;
            transform: translate(-50%, -50%) scale(var(--c-scale)) rotate(var(--c-rotate));
            transition: opacity 0.5s, box-shadow 0.3s;
        }
        .message-card:hover { box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2); }
        .message-card.floating { animation: floatAnim var(--float-duration, 4s) ease-in-out infinite alternate; animation-delay: var(--float-delay, 0s); }
        
        @keyframes floatAnim { 
            0% { transform: translate(-50%, -50%) scale(var(--c-scale)) rotate(var(--c-rotate)) translateY(0px); } 
            100% { transform: translate(-50%, -50%) scale(var(--c-scale)) rotate(var(--c-rotate)) translateY(-10px); } 
        }

        .card-text { font-weight: 800; font-size: 20px; line-height: 1.4; margin-bottom: 8px; word-wrap: break-word; white-space: pre-wrap; }
        .card-author { font-size: 14px; font-weight: bold; text-align: right; opacity: 0.9; margin-bottom: 0; }
        .card-date { position: absolute; bottom: 6px; right: 14px; font-size: 10px; opacity: 0.6; }

        /* ================= 沉浸式聚焦模式 ================= */
        .focus-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1500; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .focus-overlay.active { opacity: 1; pointer-events: auto; }
        
        .message-card.focused {
            position: fixed !important; top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) scale(1.6) rotate(0deg) !important;
            z-index: 2000 !important; animation: none !important;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ================= 10 款高對比獨立風格模板 ================= */
        .theme-classic { background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(255, 255, 255, 1); color: #333333; }
        .theme-classic .card-author { color: #555555; }

        .theme-midnight { background: rgba(30, 35, 46, 0.88); border: 1px solid rgba(160, 174, 192, 0.4); color: #F7FAFC; }
        .theme-midnight .card-author { color: #A0AEC0; }

        .theme-sage { background: rgba(215, 230, 218, 0.92); border: 1px solid rgba(170, 200, 175, 0.9); color: #274E37; }
        .theme-sage .card-author { color: #3A6B4E; }

        .theme-wine { background: rgba(135, 50, 65, 0.88); border: 1px solid rgba(200, 100, 110, 0.7); color: #FFF0F2; }
        .theme-wine .card-author { color: #FFB3C1; }

        .theme-slate { background: rgba(226, 232, 240, 0.95); border: 1px solid rgba(255, 255, 255, 0.8); color: #2D3748; }
        .theme-slate .card-author { color: #4A5568; }

        .theme-lavender { background: rgba(235, 225, 245, 0.92); border: 1px solid rgba(210, 190, 235, 0.9); color: #442966; }
        .theme-lavender .card-author { color: #6B46C1; }

        .theme-lemon { background: rgba(255, 249, 215, 0.95); border: 1px solid rgba(245, 228, 153, 0.9); color: #78600C; }
        .theme-lemon .card-author { color: #9A7B16; }

        .theme-matcha { background: rgba(235, 242, 222, 0.95); border: 1px solid rgba(200, 220, 170, 0.9); color: #455725; }
        .theme-matcha .card-author { color: #5D7A31; }

        .theme-terracotta { background: rgba(210, 115, 85, 0.9); border: 1px solid rgba(235, 151, 122, 0.8); color: #FFF5F2; }
        .theme-terracotta .card-author { color: #FFD4C4; }

        .theme-ice { background: rgba(224, 242, 254, 0.92); border: 1px solid rgba(186, 230, 253, 0.9); color: #0369A1; }
        .theme-ice .card-author { color: #075985; }

        /* 輸入區塊與表情面板 */
        .emoji-picker { display: none; position: absolute; bottom: calc(100% + 15px); left: 50%; transform: translateX(-50%); background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 20px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 280px; max-height: 220px; overflow-y: auto; flex-wrap: wrap; gap: 10px; justify-content: flex-start; z-index: 100; }
        .emoji-picker::-webkit-scrollbar { width: 6px; }
        .emoji-picker::-webkit-scrollbar-track { background: transparent; }
        .emoji-picker::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .emoji-picker.active { display: flex; align-content: flex-start; }
        .emoji-item { cursor: pointer; font-size: 24px; transition: transform 0.2s; user-select: none; width: 32px; text-align: center; }
        .emoji-item:hover { transform: scale(1.3); }
        .emoji-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 0 5px; outline: none; transition: transform 0.2s; }
        .emoji-btn:hover { transform: scale(1.1); }

        .bottom-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1001; width: 90%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; }
        .theme-selector { display: flex; justify-content: center; gap: 10px; padding: 5px; flex-wrap: wrap; }
        .theme-btn { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: 0.2s; }
        .theme-btn.active { border-color: #fff; transform: scale(1.35); box-shadow: 0 0 12px rgba(255,255,255,0.9); }
        
        .input-container { position: relative; display: flex; gap: 10px; background: var(--panel-bg); padding: 10px 15px; border-radius: 50px; box-shadow: 0 15px 35px rgba(230,100,120,0.15); align-items: center; border: 1px solid var(--card-border); }
        .input-name { width: 80px; border: none; background: var(--name-bg); padding: 8px 12px; border-radius: 20px; font-size: 15px; outline: none; text-align: center; color: var(--text-main); }
        .input-msg { flex: 1; border: none; background: var(--input-bg); font-size: 16px; outline: none; padding: 0 5px; color: var(--text-main); }
        .send-btn { background: linear-gradient(135deg, #e63946 0%, #ff8fa3 100%); border: none; padding: 10px 24px; border-radius: 30px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; white-space: nowrap; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(230,57,70,0.3); }
        .send-btn:hover { transform: translateY(-2px); }

        /* 手機版排版微調 */
        @media (max-width: 768px) {
            .header-container { padding: 12px 25px; top: 20px; }
            #mainTitle { font-size: 28px; letter-spacing: 2px; } 
            #subTitle { font-size: 14px; }
            .message-card.focused { transform: translate(-50%, -50%) scale(1.2) rotate(0deg) !important; width: 85%; }
            .input-container { flex-wrap: wrap; border-radius: 20px; justify-content: center; }
            .input-name { width: calc(40% - 10px); } .input-msg { width: 100%; flex: none; margin-top: 5px; padding: 8px 10px; background: var(--name-bg); border-radius: 15px;}
            .send-btn { width: 100%; margin-top: 5px; }
            .emoji-picker { bottom: calc(100% + 5px); width: 85%; max-height: 180px; } 
            
            /* 強制主題選擇器在手機版不換行，並微調大小與間距 */
            .theme-selector { flex-wrap: nowrap; gap: 6px; }
            .theme-btn { width: 22px; height: 22px; flex-shrink: 0; }
        }
    </style>
</head>
<body>

    <div class="geometry-bg"></div>
    <div class="geometry-bg right"></div>
    
    <div class="header-container">
        <h1 id="mainTitle">載入中...</h1>
        <p id="subTitle"></p>
    </div>
    
    <!-- 聚焦模式的背景遮罩 -->
    <div class="focus-overlay" id="focusOverlay"></div>

    <div id="wall"></div>

    <div class="bottom-panel">
        <div class="theme-selector" id="themeSelector">
            <div class="theme-btn active" data-theme="theme-classic" style="background: #ffffff;" title="純淨白"></div>
            <div class="theme-btn" data-theme="theme-midnight" style="background: #1e232e;" title="星空黑"></div>
            <div class="theme-btn" data-theme="theme-sage" style="background: #d7e6da;" title="鼠尾草綠"></div>
            <div class="theme-btn" data-theme="theme-wine" style="background: #873241;" title="勃根地紅"></div>
            <div class="theme-btn" data-theme="theme-slate" style="background: #e2e8f0;" title="迷霧灰"></div>
            <div class="theme-btn" data-theme="theme-lavender" style="background: #ebe1f5;" title="薰衣草紫"></div>
            <div class="theme-btn" data-theme="theme-lemon" style="background: #fff9d7;" title="檸檬霜"></div>
            <div class="theme-btn" data-theme="theme-matcha" style="background: #ebf2de;" title="抹茶青"></div>
            <div class="theme-btn" data-theme="theme-terracotta" style="background: #d27355;" title="陶土橘"></div>
            <div class="theme-btn" data-theme="theme-ice" style="background: #e0f2fe;" title="冰川藍"></div>
        </div>
        <div class="input-container">
            <div class="emoji-picker" id="emojiPicker"></div>
            <button id="emojiBtn" class="emoji-btn" title="加入表情">😀</button>
            <input type="text" id="nameInput" class="input-name" placeholder="你的名字" autocomplete="off">
            <input type="text" id="msgInput" class="input-msg" placeholder="寫下感謝..." autocomplete="off">
            <button id="sendBtn" class="send-btn">送出</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        
        import { firebaseConfig } from './config.js'; 

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let audioCtx;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'click') { 
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'send') { 
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) { console.log('Audio disabled or unsupported'); }
        }

        const focusOverlay = document.getElementById('focusOverlay');
        let currentFocusedCard = null;

        function closeFocus() {
            if (currentFocusedCard) {
                currentFocusedCard.classList.remove('focused');
                focusOverlay.classList.remove('active');
                currentFocusedCard = null;
                playSound('click');
            }
        }
        focusOverlay.addEventListener('click', closeFocus);

        const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','🥲','☺️','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','👽','👾','🤖','🎃','👋','🤚','🖐','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💪','👀','👁','👅','👄','💋','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','❣️','💕','💞','💓','💗','💖','💘','💝','💟','🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐻‍❄️','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄','🐝','🐛','🦋','🐌','🐞','🐜','🐢','🐍','🦎','🦖','🦕','🐙','🦑','🦐','🦞','🦀','🐡','🐠','🐟','🐬','🐳','🐋','🦈','🦭','🐊','🐅','🐆','🦓','🦍','🐘','🦛','🦏','🐪','🐫','🦒','🦘','🐃','🐂','🐄','🐎','🐖','🐏','🐑','🐐','🦌','🐕','🐩','🐈','🐈‍⬛','🐓','🦃','🦚','🦜','🦢','🦩','🕊','🐇','🦝','🦨','🦡','🦦','🦥','🐁','🐀','🐿','🦔','🐾','🐉','🐲','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🍆','🥑','🥦','🥬','🥒','🌶','🫑','🌽','🥕','🫒','🧄','🧅','🥔','🍠','🥐','🥯','🍞','🥖','🥨','🧀','🥚','🍳','🧈','🥞','🧇','🥓','🥩','🍗','🍖','🦴','🌭','🍔','🍟','🍕','🥪','🥙','🌮','🌯','🥗','🥘','🥫','🍝','🍜','🍲','🍛','🍣','🍱','🥟','🍤','🍙','🍚','🍘','🍥','🥮','🍢','🍡','🍧','🍨','🍦','🥧','🧁','🍰','🎂','🍮','🍭','🍬','🍫','🍿','🍩','🍪','🌰','🥜','🍯','🥛','🍼','🫖','☕️','🍵','🧃','🥤','🧋','🍶','🍺','🍻','🥂','🍷','🥃','🍸','🍹','🧉','🍾','🧊','🥄','🍴','🍽','🥣','🥡','🥢','🧂','✨','🔥','🎉','💡','💯','⚠️','✅','❌','🎵','🎶','🔔','📣','💬','💭'];
        
        const picker = document.getElementById('emojiPicker');
        const msgInput = document.getElementById('msgInput');
        
        emojis.forEach(e => {
            const span = document.createElement('span'); span.className = 'emoji-item'; span.innerText = e;
            span.onclick = () => { msgInput.value += e; picker.classList.remove('active'); msgInput.focus(); playSound('click'); };
            picker.appendChild(span);
        });

        document.getElementById('emojiBtn').addEventListener('click', (e) => { e.stopPropagation(); picker.classList.toggle('active'); playSound('click'); });
        document.addEventListener('click', () => picker.classList.remove('active'));
        picker.addEventListener('click', (e) => e.stopPropagation());

        let currentTheme = 'theme-classic';
        let systemSettings = { maxMessages: 50, retentionDays: 30 };

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                playSound('click');
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTheme = this.getAttribute('data-theme');
            });
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim() || '匿名';
            const text = msgInput.value.trim();
            if (text === '') return;

            push(ref(db, 'messages'), { text: text, author: name, theme: currentTheme, timestamp: Date.now() });
            msgInput.value = '';

            playSound('send');
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.8 }, zIndex: 9999 });
        });

        msgInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('mainTitle').innerText = data.mainTitle || '羅氏感謝牆';
                document.getElementById('subTitle').innerText = data.subTitle || '每個人都可以在這裡抒發內心的感謝';
                systemSettings.maxMessages = data.maxMessages || 50;
                systemSettings.retentionDays = data.retentionDays || 30;
                renderWall();
            }
        });

        let rawMessages = [];
        onValue(query(ref(db, 'messages')), (snapshot) => {
            rawMessages = [];
            snapshot.forEach((child) => { rawMessages.push({ id: child.key, ...child.val() }); });
            rawMessages.sort((a, b) => b.timestamp - a.timestamp);
            renderWall();
        });

        function renderWall() {
            const wall = document.getElementById('wall');
            wall.innerHTML = '';
            const now = Date.now();
            const retentionMs = systemSettings.retentionDays * 24 * 60 * 60 * 1000;
            const validMessages = rawMessages.filter(msg => (now - msg.timestamp) <= retentionMs).slice(0, systemSettings.maxMessages);
            const total = validMessages.length;
            if (total === 0) return;

            const isMobile = window.innerWidth <= 768;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const centerX = screenW / 2;
            const centerY = screenH * 0.45; 
            let richnessScale = total <= 3 ? 1.6 : (total <= 10 ? 1.3 : 1.0);
            const mobileScaleDown = isMobile ? 0.75 : 1.0; 
            const placedRects = [];
            
            const topLimit = isMobile ? 180 : 220; 
            const bottomLimit = isMobile ? 200 : 180; 
            const sideLimit = isMobile ? 15 : 50;
            const availableW = screenW - (sideLimit * 2);
            const availableH = screenH - topLimit - bottomLimit;
            
            const basePadding = isMobile ? 10 : 30;
            const dynamicPadding = basePadding - (total * 2.5);
            const collisionPadding = Math.max(-55, dynamicPadding); 

            validMessages.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = `message-card ${msg.theme || 'theme-classic'}`;
                
                const dateObj = new Date(msg.timestamp);
                const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

                card.innerHTML = `
                    <div class="card-text">${msg.text}</div>
                    <div class="card-author">- ${msg.author}</div>
                    <div class="card-date">${dateStr}</div>
                `;

                const ageRatio = total > 1 ? index / (total - 1) : 0;
                const scale = (1.5 - (ageRatio * 0.9)) * richnessScale * mobileScaleDown;
                const opacity = 1 - (ageRatio * 0.35);
                const randomRotate = (Math.random() - 0.5) * 14;

                card.style.setProperty('--c-scale', scale);
                card.style.setProperty('--c-rotate', `${randomRotate}deg`);
                card.style.opacity = opacity; 
                card.style.zIndex = total - index;
                card.style.visibility = 'hidden'; 
                wall.appendChild(card);

                const cardW = card.offsetWidth * scale;
                const cardH = card.offsetHeight * scale;

                let placedX = centerX, placedY = centerY, foundSpot = false;
                
                for (let attempt = 0; attempt < 500; attempt++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spreadProgress = Math.min(1, (ageRatio * 0.7) + (attempt * 0.02));
                    const randomJitter = 0.8 + Math.random() * 0.4;
                    
                    const testX = centerX + Math.cos(angle) * (availableW / 2) * spreadProgress * randomJitter;
                    const testY = centerY + Math.sin(angle) * (availableH / 2) * spreadProgress * randomJitter;
                    
                    if (testX - cardW/2 < sideLimit || testX + cardW/2 > screenW - sideLimit || testY - cardH/2 < topLimit || testY + cardH/2 > screenH - bottomLimit) continue; 
                    
                    let hasCollision = false;
                    for (let rect of placedRects) {
                        if (Math.abs(testX - rect.x) < (cardW + rect.w) / 2 + collisionPadding && Math.abs(testY - rect.y) < (cardH + rect.h) / 2 + collisionPadding) {
                            hasCollision = true; break;
                        }
                    }
                    if (!hasCollision) { placedX = testX; placedY = testY; foundSpot = true; break; }
                }

                if (!foundSpot) { placedX = centerX + (Math.random() - 0.5) * (availableW*0.8); placedY = centerY + (Math.random() - 0.5) * (availableH*0.8); }
                
                placedX = Math.max(sideLimit + cardW/2, Math.min(screenW - sideLimit - cardW/2, placedX));
                placedY = Math.max(topLimit + cardH/2, Math.min(screenH - bottomLimit - cardH/2, placedY));
                
                placedRects.push({ x: placedX, y: placedY, w: cardW, h: cardH });
                
                card.style.left = `${placedX}px`; card.style.top = `${placedY}px`;
                card.style.visibility = 'visible'; 
                card.classList.add('floating');
                card.style.setProperty('--float-duration', `${3 + Math.random() * 2}s`);
                card.style.setProperty('--float-delay', `-${Math.random() * 2}s`);

                card.addEventListener('click', () => {
                    if (currentFocusedCard === card) { closeFocus(); return; }
                    if (currentFocusedCard) currentFocusedCard.classList.remove('focused');
                    
                    playSound('click');
                    card.classList.add('focused');
                    focusOverlay.classList.add('active');
                    currentFocusedCard = card;
                });
            });
        }
        window.addEventListener('resize', renderWall);
    </script>
</body>
