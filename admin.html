<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感謝牆 - 後台管理</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f5f7; padding: 20px; color: #333; }
        .container { background: #fff; padding: 30px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-top: 25px; color: #2c3e50; }
        label { display: block; margin: 15px 0 5px; font-size: 14px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #4caf50; }
        button.save-btn { background: #4caf50; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; transition: background 0.3s; }
        button.save-btn:hover { background: #45a049; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        td { word-break: break-all; }
        button.del-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        button.del-btn:hover { background: #e60000; }
        .empty-msg { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h2>牆面設定</h2>
        <label>主標題</label>
        <input type="text" id="mainTitleInput" placeholder="例如：Roche 感謝牆">
        
        <label>副標題</label>
        <input type="text" id="subTitleInput" placeholder="例如：每一個微小的感謝，都是照亮團隊的光">
        
        <label>畫面上最多顯示幾則留言？</label>
        <input type="number" id="maxMessagesInput" placeholder="例如：50">
        
        <label>留言保留天數？ (超過自動隱藏)</label>
        <input type="number" id="retentionDaysInput" placeholder="例如：30">
        
        <button class="save-btn" id="saveBtn">儲存設定</button>

        <h2>留言管理清單</h2>
        <table>
            <thead>
                <tr>
                    <th width="15%">時間</th>
                    <th width="15%">留言人</th>
                    <th width="60%">內容</th>
                    <th width="10%">操作</th>
                </tr>
            </thead>
            <tbody id="messageList">
                <tr><td colspan="4" class="empty-msg">載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 注意這裡加上了 type="module" -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        
        // 👉 從 config.js 引入你的金鑰
        import { firebaseConfig } from './config.js'; 

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 讀取目前的設定
        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('mainTitleInput').value = data.mainTitle || '';
                document.getElementById('subTitleInput').value = data.subTitle || '';
                document.getElementById('maxMessagesInput').value = data.maxMessages || '';
                document.getElementById('retentionDaysInput').value = data.retentionDays || '';
            }
        });

        // 儲存設定按鈕事件
        document.getElementById('saveBtn').addEventListener('click', () => {
            const settings = {
                mainTitle: document.getElementById('mainTitleInput').value,
                subTitle: document.getElementById('subTitleInput').value,
                maxMessages: parseInt(document.getElementById('maxMessagesInput').value) || 50,
                retentionDays: parseInt(document.getElementById('retentionDaysInput').value) || 30
            };
            set(ref(db, 'settings'), settings).then(() => {
                alert('設定已成功儲存！');
            }).catch(err => {
                alert('儲存失敗：' + err.message);
            });
        });

        // 讀取並顯示所有留言
        onValue(query(ref(db, 'messages')), (snapshot) => {
            const list = document.getElementById('messageList');
            list.innerHTML = ''; 
            
            let messages = [];
            snapshot.forEach((child) => {
                messages.push({ id: child.key, ...child.val() });
            });
            
            // 依照時間由新到舊排序
            messages.sort((a, b) => b.timestamp - a.timestamp);

            if (messages.length === 0) {
                list.innerHTML = '<tr><td colspan="4" class="empty-msg">目前沒有任何留言</td></tr>';
                return;
            }

            messages.forEach(msg => {
                const dateObj = new Date(msg.timestamp);
                const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${msg.author}</td>
                    <td>${msg.text}</td>
                    <td><button class="del-btn" data-id="${msg.id}">刪除</button></td>
                `;
                list.appendChild(tr);
            });

            // 綁定刪除按鈕功能
            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    if(confirm('確定要永久刪除這則留言嗎？')) {
                        remove(ref(db, 'messages/' + id));
                    }
                });
            });
        });
    </script>
</body>
</html>
